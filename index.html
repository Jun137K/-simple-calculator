<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角関数測定</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f2f2f7;
  padding: 20px;
}

h1 {
  text-align: center;
}

.box {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 15px;
}

input {
  width: 100%;
  box-sizing: border-box;
  font-size: 22px;
  padding: 12px;
  margin: 8px 0 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #007aff;
  color: white;
}

.result {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>📐 三角関数測定</h1>

<div class="box">

<h2>高さを計算</h2>

<label>水平距離（m）</label>
<input id="distance" type="number" step="0.01">

<label>角度（°）</label>
<input id="angle" type="number" step="0.1">

<button onclick="calculateHeight()">
高さを計算
</button>

<div id="result" class="result">
--
</div>

</div>

<script>

function calculateHeight() {

  const distance =
    Number(document.getElementById("distance").value);

  const angle =
    Number(document.getElementById("angle").value);

  const radian =
    angle * Math.PI / 180;

  const height =
    distance * Math.tan(radian);

  document.getElementById("result").innerHTML =
    height.toFixed(2) + " m";
}

</script>

</body>
</html>
