<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フランジ穴間計算</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f2f2f7;
  color: #111;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
}

main {
  max-width: 520px;
  margin: auto;
  padding: 18px 16px 35px;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 8px 0 4px;
}

.sub {
  text-align: center;
  color: #666;
  font-size: 13px;
  margin-bottom: 18px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin: 12px 0;
  box-shadow: 0 2px 10px rgba(0,0,0,.07);
}

label {
  display: block;
  font-weight: 700;
  margin: 13px 0 6px;
}

input {
  width: 100%;
  padding: 13px;
  font-size: 22px;
  border: 1px solid #ccc;
  border-radius: 11px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  border: 0;
  border-radius: 12px;
  background: #0b5cff;
  color: white;
  font-size: 18px;
  font-weight: 700;
}

.result {
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.name {
  font-size: 14px;
  color: #666;
}

.value {
  font-size: 29px;
  font-weight: 800;
  margin-top: 3px;
}

.error {
  color: #c00;
  font-weight: 700;
  margin-top: 14px;
}

.note {
  font-size: 12px;
  color: #666;
  line-height: 1.6;
  margin-top: 14px;
}
</style>
</head>

<body>

<main>

<h1>🔩 フランジ穴間計算</h1>

<div class="sub">
PCD・穴数・穴径・フランジ外径から計算
</div>

<div class="card">

<label>フランジ外径（mm）</label>
<input id="outer" type="number" inputmode="decimal" step="0.01">

<label>PCD（mm）</label>
<input id="pcd" type="number" inputmode="decimal" step="0.01">

<label>穴数（個）</label>
<input id="count" type="number" inputmode="numeric" step="1">

<label>穴径（mm）</label>
<input id="hole" type="number" inputmode="decimal" step="0.01">

<button onclick="calculate()">
計算する
</button>

<div id="error"></div>

</div>

<div class="card" id="results" style="display:none">

<div class="result">
<div class="name">隣接穴の中心間距離</div>
<div class="value" id="center"></div>
</div>

<div class="result">
<div class="name">隣接穴の端面同士の距離</div>
<div class="value" id="edge"></div>
</div>

<div class="result">
<div class="name">穴端面〜フランジ外周の距離</div>
<div class="value" id="outerEdge"></div>
</div>

<div class="note">
※穴はPCD上に等間隔で配置されているものとして計算します。<br>
※「穴端面同士」は隣接する2つの穴の最短距離です。
</div>

</div>

</main>

<script>

function calculate() {

const D = Number(document.getElementById("outer").value);
const P = Number(document.getElementById("pcd").value);
const N = Number(document.getElementById("count").value);
const d = Number(document.getElementById("hole").value);

const error = document.getElementById("error");
const results = document.getElementById("results");

error.textContent = "";
results.style.display = "none";

if (!D || !P || !N || !d || D <= 0 || P <= 0 || N < 2 || d <= 0) {
error.textContent = "すべての項目を正しく入力してください。";
return;
}

if (P > D) {
error.textContent = "PCDはフランジ外径以下にしてください。";
return;
}

const center = P * Math.sin(Math.PI / N);

const edge = center - d;

const outerEdge = (D - P - d) / 2;

if (edge < 0) {
error.textContent = "穴同士が重なっています。寸法を確認してください。";
return;
}

if (outerEdge < 0) {
error.textContent = "穴がフランジ外周からはみ出します。寸法を確認してください。";
return;
}

document.getElementById("center").innerHTML =
center.toFixed(2) + " mm";

document.getElementById("edge").innerHTML =
edge.toFixed(2) + " mm";

document.getElementById("outerEdge").innerHTML =
outerEdge.toFixed(2) + " mm";

results.style.display = "block";

}

</script>

</body>
</html>
