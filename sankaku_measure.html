<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>三角関数測定</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f3f4f6;color:#111827}
main{max-width:520px;margin:auto;padding:18px 16px 32px}
h1{font-size:25px;margin:6px 0 4px}.sub{color:#6b7280;font-size:13px;margin-bottom:18px}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input{width:100%;font-size:22px;padding:12px;border:1px solid #d1d5db;border-radius:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;border:0;border-radius:13px;padding:14px;font-size:17px;font-weight:700;background:#111827;color:white;margin-top:14px}
button.secondary{background:#e5e7eb;color:#111827}
.result{font-size:34px;font-weight:800;text-align:center;padding:14px 0 4px}.unit{text-align:center;color:#6b7280}
.small{font-size:12px;color:#6b7280;line-height:1.5}
.ok{color:#047857;font-weight:700}.err{color:#b91c1c;font-weight:700}
</style>
</head>
<body>
<main>
<h1>📐 三角関数測定</h1>
<div class="sub">高さ・水平距離・斜辺を計算する試作品</div>

<div class="card">
  <div class="row">
    <div>
      <label>水平距離</label>
      <input id="distance" type="number" inputmode="decimal" step="0.01" placeholder="10">
    </div>
    <div>
      <label>角度（°）</label>
      <input id="angle" type="number" inputmode="decimal" step="0.1" placeholder="30">
    </div>
  </div>
  <button onclick="calcHeight()">高さを計算</button>
  <div id="heightResult"></div>
</div>

<div class="card">
  <label>高さ</label>
  <input id="height" type="number" inputmode="decimal" step="0.01" placeholder="5">

  <label>角度（°）</label>
  <input id="angle2" type="number" inputmode="decimal" step="0.1" placeholder="30">

  <button onclick="calcDistance()">水平距離を計算</button>
  <div id="distanceResult"></div>
</div>

<div class="card">
  <label>iPhoneの傾き角度</label>
  <button onclick="startSensor()">📱 角度センサーを開始</button>
  <div id="sensor" class="result">--.-°</div>
  <div id="sensorMsg" class="small">Safariではセンサー利用の許可が必要な場合があります。</div>
</div>

<div class="card">
  <div class="small">
    <b>計算方法</b><br>
    高さ ＝ 水平距離 × tan(角度)<br>
    水平距離 ＝ 高さ ÷ tan(角度)<br><br>
    ※地面が水平で、測定位置と対象物の基準高さが同じ場合を想定した簡易計算です。
  </div>
</div>
</main>

<script>
function val(id){return parseFloat(document.getElementById(id).value)}
function show(id,n){
 document.getElementById(id).innerHTML =
 `<div class="result">${n.toFixed(2)} m</div><div class="unit">計算結果</div>`;
}
function calcHeight(){
 const d=val("distance"), a=val("angle");
 if(!isFinite(d)||!isFinite(a)||d<0||a<=-90||a>=90){
   document.getElementById("heightResult").innerHTML='<p class="err">距離と角度を正しく入力してください</p>';return;
 }
 show("heightResult",d*Math.tan(a*Math.PI/180));
}
function calcDistance(){
 const h=val("height"), a=val("angle2");
 if(!isFinite(h)||!isFinite(a)||h<0||a<=0||a>=90){
   document.getElementById("distanceResult").innerHTML='<p class="err">高さと角度を正しく入力してください</p>';return;
 }
 show("distanceResult",h/Math.tan(a*Math.PI/180));
}
async function startSensor(){
 const msg=document.getElementById("sensorMsg");
 try{
   if(typeof DeviceOrientationEvent==="undefined"){msg.textContent="この端末では方向センサーを利用できません。";return;}
   if(typeof DeviceOrientationEvent.requestPermission==="function"){
     const p=await DeviceOrientationEvent.requestPermission();
     if(p!=="granted"){msg.textContent="センサーの利用が許可されませんでした。";return;}
   }
   window.addEventListener("deviceorientation",e=>{
     let x=e.beta;
     if(typeof x==="number") document.getElementById("sensor").textContent=x.toFixed(1)+"°";
   });
   msg.innerHTML='<span class="ok">センサー取得中</span>';
 }catch(e){msg.textContent="センサーを開始できませんでした。";}
}
</script>
</body>
</html>
