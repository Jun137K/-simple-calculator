<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sin・cos・tan 計算機</title>

<style>
body{
  margin:0;
  padding:16px;
  background:#f3f5f8;
  font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;
  color:#222;
}

.app{
  max-width:620px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 12px #0001;
}

h1{
  text-align:center;
  font-size:28px;
}

h2{
  font-size:21px;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,
select,
button{
  width:100%;
  min-height:48px;
  border:1px solid #ccd2da;
  border-radius:12px;
  padding:10px;
  font-size:18px;
  box-sizing:border-box;
}

button{
  margin-top:14px;
  background:#1677d2;
  color:white;
  border:0;
  font-weight:bold;
}

.diagram{
  width:100%;
  display:block;
}

.formula,
.result div{
  background:#f7f8fc;
  border-radius:12px;
  padding:13px;
  margin-top:8px;
  font-size:18px;
}

.sin{
  color:#c0392b;
  font-weight:bold;
}

.cos{
  color:#218c45;
  font-weight:bold;
}

.tan{
  color:#b36b00;
  font-weight:bold;
}

.value{
  float:right;
  font-weight:bold;
}

.small{
  color:#667085;
  font-size:14px;
}
</style>
</head>

<body>

<div class="app">

<h1>三角関数 計算機</h1>

<!-- 角度 -->
<div class="card">

<h2>① 角度を入力</h2>

<label>角度 θ（度）</label>

<input
  id="angle"
  type="number"
  inputmode="decimal"
  value="45"
  step="any"
>

<button onclick="calc()">
計算する
</button>

</div>


<!-- 三角形 -->
<div class="card">

<h2>② どの部分を計算している？</h2>

<svg
  class="diagram"
  viewBox="0 0 620 390"
>

<!-- 三角形 -->
<line
  x1="70"
  y1="300"
  x2="510"
  y2="300"
  stroke="#222"
  stroke-width="7"
/>

<line
  x1="510"
  y1="300"
  x2="510"
  y2="75"
  stroke="#222"
  stroke-width="7"
/>

<line
  x1="70"
  y1="300"
  x2="510"
  y2="75"
  stroke="#222"
  stroke-width="7"
/>


<!-- 90度 -->
<path
  d="M482 300 L482 272 L510 272"
  fill="none"
  stroke="#222"
  stroke-width="5"
/>

<text
  x="555"
  y="330"
  font-size="22"
  font-weight="bold"
>
90°
</text>


<!-- θ -->
<path
  d="M125 300 A55 55 0 0 1 120 273"
  fill="none"
  stroke="#222"
  stroke-width="4"
/>

<text
  x="128"
  y="282"
  font-size="25"
  font-weight="bold"
>
θ
</text>


<!-- 隣辺 -->
<text
  x="290"
  y="335"
  text-anchor="middle"
  font-size="24"
  font-weight="bold"
  fill="#218c45"
>
隣辺（底辺）
</text>


<!-- 対辺 -->
<text
  x="560"
  y="195"
  text-anchor="middle"
  font-size="23"
  font-weight="bold"
  fill="#c0392b"
  transform="rotate(90 560 195)"
>
対辺（高さ）
</text>


<!-- 斜辺 -->
<text
  x="285"
  y="145"
  text-anchor="middle"
  font-size="24"
  font-weight="bold"
  fill="#2166a5"
>
斜辺
</text>

</svg>


<div class="formula">

<div>
<span class="sin">sin θ</span>
＝ 対辺 ÷ 斜辺
</div>

<div>
<span class="cos">cos θ</span>
＝ 隣辺 ÷ 斜辺
</div>

<div>
<span class="tan">tan θ</span>
＝ 対辺 ÷ 隣辺
</div>

</div>

</div>


<!-- 結果 -->
<div class="card">

<h2>③ 計算結果</h2>

<div class="result">

<div>
<span class="sin">sin θ</span>
<span class="value" id="sin">---</span>
</div>

<div>
<span class="cos">cos θ</span>
<span class="value" id="cos">---</span>
</div>

<div>
<span class="tan">tan θ</span>
<span class="value" id="tan">---</span>
</div>

</div>

<p class="small">
例：45° → sin 45° = 0.7071
</p>

</div>


<!-- 距離計算 -->
<div class="card">

<h2>④ 距離を計算</h2>

<label>
基準となる長さ
</label>

<input
  id="length"
  type="number"
  inputmode="decimal"
  placeholder="例：100"
  step="any"
>


<label>
求める距離
</label>

<select id="type">

<option value="opposite">
対辺（高さ）＝ 長さ × sin θ
</option>

<option value="adjacent">
隣辺（底辺）＝ 長さ × cos θ
</option>

<option value="hypoS">
斜辺 ＝ 対辺 ÷ sin θ
</option>

<option value="hypoC">
斜辺 ＝ 隣辺 ÷ cos θ
</option>

</select>


<button onclick="distance()">
距離を計算
</button>


<div class="result">

<div>
計算結果
<span
  class="value"
  id="dist"
>
---
</span>
</div>

</div>

</div>

</div>


<script>

function fmt(x){

  if(Math.abs(x)<1e-12){
    x=0;
  }

  return x.toFixed(4);

}


function calc(){

  const angle =
    Number(
      document.getElementById("angle").value
    );

  if(!Number.isFinite(angle)){
    return;
  }


  const rad =
    angle * Math.PI / 180;


  const s =
    Math.sin(rad);

  const c =
    Math.cos(rad);

  const t =
    Math.tan(rad);


  document.getElementById("sin").textContent =
    fmt(s);

  document.getElementById("cos").textContent =
    fmt(c);

  document.getElementById("tan").textContent =
    Math.abs(c)<1e-12
      ? "定義なし"
      : fmt(t);

}


function distance(){

  const angle =
    Number(
      document.getElementById("angle").value
    );

  const L =
    Number(
      document.getElementById("length").value
    );


  if(
    !Number.isFinite(angle) ||
    !Number.isFinite(L)
  ){

    document.getElementById("dist").textContent =
      "入力してください";

    return;
  }


  const rad =
    angle * Math.PI / 180;


  const s =
    Math.sin(rad);

  const c =
    Math.cos(rad);


  const type =
    document.getElementById("type").value;


  let x;


  if(type==="opposite"){

    x = L * s;

  }

  else if(type==="adjacent"){

    x = L * c;

  }

  else if(type==="hypoS"){

    if(Math.abs(s)<1e-12){

      document.getElementById("dist").textContent =
        "計算できません";

      return;

    }

    x = L / s;

  }

  else{

    if(Math.abs(c)<1e-12){

      document.getElementById("dist").textContent =
        "計算できません";

      return;

    }

    x = L / c;

  }


  document.getElementById("dist").textContent =
    Number(x.toFixed(4));

}


calc();

</script>

</body>
</html>
